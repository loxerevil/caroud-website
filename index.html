<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CAROUD – Hier entsteht bald was Neues</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    :root {
      --ink: #1c1b19;
      --gold: #b9a06a;
      --serif: Georgia, "Times New Roman", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: #f2ede3;
      font-family: var(--serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
      padding: 24px 16px;
    }
    .logo {
      width: min(280px, 70vw);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 2px;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.3s forwards;
    }
    h1 .gold { color: var(--gold); }
    .msg {
      max-width: 560px;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
      color: #cfc8ba;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.6s forwards;
    }
    .msg b { color: var(--gold); font-weight: 600; }

    /* ---------- unendliche Warteschlange ---------- */
    .queue-wrap {
      width: 100%;
      max-width: 720px;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.9s forwards;
    }
    .queue-label {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .queue-count {
      font-size: 1.05rem;
      color: #cfc8ba;
      margin-bottom: 18px;
      font-variant-numeric: tabular-nums;
    }
    .queue-belt {
      position: relative;
      overflow: hidden;
      padding: 10px 0 0;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    }
    .queue-track {
      display: flex;
      width: max-content;
      animation: march 14s linear infinite;
    }
    .queue-track svg {
      width: 54px;
      height: 90px;
      flex: 0 0 auto;
      margin: 0 10px;
      animation: bob 1.6s ease-in-out infinite;
    }
    .queue-track svg:nth-child(2n) { animation-delay: 0.4s; }
    .queue-track svg:nth-child(3n) { animation-delay: 0.8s; }
    .queue-track svg:nth-child(5n) { animation-delay: 1.2s; }
    .queue-floor {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(185,160,106,0.6), transparent);
      margin-top: 6px;
    }
    .hint {
      margin-top: 26px;
      font-size: 0.85rem;
      color: #7d7668;
      font-style: italic;
    }
    @keyframes march {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <img class="logo" src="img/logo-text-transparent.png" alt="CAROUD – Fine Fragrance for the Drive">

  <h1>Shu lau <span class="gold">👋</span></h1>
  <p class="msg">
    Wir sind gerade in <b>Wartung</b> und müssen hier erstmal alles bauen.<br>
    <b>Walid</b> &amp; <b>Samet</b> machen das Ganze schon –<br>
    hier entsteht bald was Neues.
  </p>

  <div class="queue-wrap">
    <div class="queue-label">Warteschlange</div>
    <div class="queue-count">Vor dir: <span id="count">∞</span> Sprühdosen</div>
    <div class="queue-belt">
      <div class="queue-track" id="track"></div>
      <div class="queue-floor"></div>
    </div>
    <p class="hint">Geschätzte Wartezeit: bis es fertig ist.</p>
  </div>

  <script>
    // Sprühdosen-Platzhalter aus dem Shop-Prototyp
    function sprayBottleSVG(color) {
      return `
      <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="52" y="4" width="16" height="14" rx="2" fill="#222"/>
        <rect x="44" y="18" width="32" height="16" rx="3" fill="#111"/>
        <path d="M38 40 Q38 34 46 34 H74 Q82 34 82 40 L86 60 V186 Q86 194 78 194 H42 Q34 194 34 186 V60 Z" fill="${color}" stroke="rgba(0,0,0,0.25)"/>
        <rect x="42" y="88" width="36" height="46" rx="3" fill="#fff" stroke="#ddd"/>
        <text x="60" y="106" text-anchor="middle" font-size="9" font-weight="600" font-family="Georgia, serif" letter-spacing="1" fill="#111">CAROUD</text>
        <rect x="48" y="112" width="24" height="4" rx="2" fill="${color}" stroke="rgba(0,0,0,0.2)"/>
      </svg>`;
    }

    const colors = ["#b9a06a", "#3a3a3a", "#7a1f2b", "#93a3ad", "#e8d9b8", "#274a3d"];
    // zwei identische Hälften -> nahtlose Endlosschleife
    let row = "";
    for (let i = 0; i < 14; i++) row += sprayBottleSVG(colors[i % colors.length]);
    document.getElementById("track").innerHTML = row + row;

    // Zähler, der immer weiter STEIGT statt zu sinken
    let n = 99999999;
    const el = document.getElementById("count");
    el.textContent = n.toLocaleString("de-DE");
    setInterval(() => {
      n += Math.floor(Math.random() * 7) + 1;
      el.textContent = n.toLocaleString("de-DE");
    }, 800);
  </script>
</body>
</html>
