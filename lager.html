<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Caroud – Lager</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <!-- iPhone Homescreen-App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caroud Lager">
  <link rel="apple-touch-icon" href="img/favicon.png">
  <meta name="theme-color" content="#1c1b19">
  <style>
    :root {
      --gold: #b9a06a;
      --gold-dark: #a08a55;
      --ink: #1c1b19;
      --ink-2: #262420;
      --ink-line: #2e2c28;
      --paper: #f2efe9;
      --grey: #8a867e;
      --red: #c0504a;
      --orange: #cf9040;
      --green: #6fa172;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--ink);
      color: var(--paper);
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* ============ Login ============ */
    .login-wrap {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .login-card { width: 100%; max-width: 340px; text-align: center; }
    .login-card h1 {
      font-family: var(--serif);
      font-weight: 500;
      letter-spacing: 4px;
      color: var(--gold);
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }
    .login-card p { color: var(--grey); font-size: 0.85rem; margin-bottom: 1.8rem; letter-spacing: 1px; }
    .login-card input {
      width: 100%;
      background: var(--ink-2);
      border: 1px solid var(--ink-line);
      border-radius: 10px;
      color: var(--paper);
      font-size: 1rem;
      padding: 0.85rem 1rem;
      margin-bottom: 0.8rem;
      outline: none;
    }
    .login-card input:focus { border-color: var(--gold-dark); }
    .login-card button {
      width: 100%;
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 0.9rem;
      cursor: pointer;
      margin-top: 0.4rem;
    }
    .login-card button:active { background: var(--gold-dark); }
    .login-error { color: var(--red); font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
    /* ============ App ============ */
    .app { display: none; min-height: 100dvh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(28, 27, 25, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--ink-line);
      padding: calc(0.8rem + env(safe-area-inset-top)) 1.1rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar h1 {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .topbar .sub { font-size: 0.72rem; color: var(--grey); letter-spacing: 1px; }
    .logout {
      background: none;
      border: 1px solid var(--ink-line);
      color: var(--grey);
      border-radius: 8px;
      font-size: 0.75rem;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }
    /* Statuszeile */
    .stats {
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 1.1rem 0.2rem;
    }
    .stat {
      flex: 1;
      background: var(--ink-2);
      border: 1px solid var(--ink-line);
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.25rem; font-weight: 600; }
    .stat span { font-size: 0.62rem; color: var(--grey); letter-spacing: 1px; text-transform: uppercase; }
    .stat.warn b { color: var(--orange); }
    .stat.out b { color: var(--red); }
    /* Produktliste */
    .cat-title {
      font-family: var(--serif);
      font-size: 0.95rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      padding: 1.4rem 1.1rem 0.5rem;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--ink-2);
      border: 1px solid var(--ink-line);
      border-radius: 14px;
      padding: 0.75rem 0.9rem;
      margin: 0 1.1rem 0.6rem;
    }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .item .name { flex: 1; min-width: 0; }
    .item .name b { display: block; font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .name span { font-size: 0.72rem; color: var(--grey); }
    .item .name span.low { color: var(--orange); }
    .item .name span.out { color: var(--red); }
    .qty {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .qty button {
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1px solid var(--ink-line);
      background: var(--ink);
      color: var(--paper);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty button:active { background: var(--gold); color: var(--ink); }
    .qty button:disabled { opacity: 0.3; }
    .qty .count {
      min-width: 52px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.3rem 0.2rem;
    }
    .qty .count.out { color: var(--red); }
    .qty .count.low { color: var(--orange); }
    .qty .count.ok { color: var(--green); }
    .offline-note {
      display: none;
      background: var(--red);
      color: #fff;
      text-align: center;
      font-size: 0.78rem;
      padding: 0.4rem;
      letter-spacing: 1px;
    }
    .footer-space { height: 3rem; }
    .loading {
      text-align: center;
      color: var(--grey);
      padding: 3rem 1rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <h1>CAROUD</h1>
      <p>LAGERVERWALTUNG</p>
      <input type="email" id="loginEmail" placeholder="E-Mail" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="appView">
    <div class="offline-note" id="offlineNote">OFFLINE – Änderungen werden synchronisiert, sobald du wieder online bist</div>
    <div class="topbar">
      <div>
        <h1>CAROUD</h1>
        <div class="sub">Lagerbestand</div>
      </div>
      <button class="logout" id="logoutBtn">Abmelden</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">–</b><span>Stück gesamt</span></div>
      <div class="stat warn"><b id="statLow">–</b><span>Fast leer</span></div>
      <div class="stat out"><b id="statOut">–</b><span>Ausverkauft</span></div>
    </div>
    <div id="list" class="loading">Lade Bestände…</div>
    <div class="footer-space"></div>
  </div>

  <script src="js/products.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, doc, onSnapshot, setDoc,
      increment, serverTimestamp, enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---- Firebase-Konfiguration (Projekt caroud-lager) ----
    const firebaseConfig = {
      apiKey: "AIzaSyBffFvICYg4tHzrRDanLT8gvB6ciGj5RSQ",
      authDomain: "caroud-lager.firebaseapp.com",
      projectId: "caroud-lager",
      storageBucket: "caroud-lager.firebasestorage.app",
      messagingSenderId: "538993545159",
      appId: "1:538993545159:web:a9e80ec1ea65a7723413e2",
    };

    const LOW_STOCK = 5; // ab dieser Menge gilt "fast leer"

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    enableIndexedDbPersistence(db).catch(() => {});

    const $ = (id) => document.getElementById(id);
    const stock = {}; // productId -> Anzahl

    // ---- Login ----
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginPass").value);
      } catch (err) {
        $("loginError").textContent =
          err.code === "auth/invalid-credential" ? "E-Mail oder Passwort falsch." :
          err.code === "auth/too-many-requests" ? "Zu viele Versuche – kurz warten." :
          "Anmeldung fehlgeschlagen (" + err.code + ")";
      }
    });
    $("logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      $("loginView").style.display = user ? "none" : "flex";
      $("appView").style.display = user ? "block" : "none";
      if (user) startListening();
    });

    // ---- Firestore live ----
    let unsub = null;
    function startListening() {
      if (unsub) return;
      unsub = onSnapshot(collection(db, "lager"), (snap) => {
        snap.forEach((d) => { stock[d.id] = d.data().stock ?? 0; });
        render();
      }, (err) => {
        $("list").innerHTML = '<div class="loading">Fehler beim Laden: ' + err.code + "</div>";
      });
    }

    function setStock(id, value) {
      value = Math.max(0, value);
      stock[id] = value; // sofortiges UI-Feedback
      render();
      setDoc(doc(db, "lager", id), { stock: value, updated: serverTimestamp() }, { merge: true });
    }
    function changeStock(id, delta) {
      const next = Math.max(0, (stock[id] ?? 0) + delta);
      stock[id] = next;
      render();
      setDoc(doc(db, "lager", id), { stock: next, updated: serverTimestamp() }, { merge: true });
    }

    // ---- Rendern ----
    function statusClass(n) { return n === 0 ? "out" : n < LOW_STOCK ? "low" : "ok"; }
    function statusText(n)  { return n === 0 ? "Ausverkauft" : n < LOW_STOCK ? "Fast leer" : "Auf Lager"; }

    function render() {
      let total = 0, low = 0, out = 0;
      const frag = document.createDocumentFragment();

      CATEGORIES.forEach((cat) => {
        const items = PRODUCTS.filter((p) => p.category === cat.name);
        if (!items.length) return;
        const h = document.createElement("div");
        h.className = "cat-title";
        h.textContent = cat.name;
        frag.appendChild(h);

        items.forEach((p) => {
          const n = stock[p.id] ?? 0;
          total += n;
          if (n === 0) out++; else if (n < LOW_STOCK) low++;

          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML =
            '<div class="dot" style="background:' + p.color + '"></div>' +
            '<div class="name"><b>' + p.name + "</b><span class=\"" + statusClass(n) + "\">" + statusText(n) + "</span></div>" +
            '<div class="qty">' +
              '<button type="button" class="minus"' + (n === 0 ? " disabled" : "") + ">&minus;</button>" +
              '<div class="count ' + statusClass(n) + '">' + n + "</div>" +
              '<button type="button" class="plus">+</button>' +
            "</div>";
          row.querySelector(".minus").addEventListener("click", () => changeStock(p.id, -1));
          row.querySelector(".plus").addEventListener("click", () => changeStock(p.id, +1));
          row.querySelector(".count").addEventListener("click", () => {
            const v = prompt("Bestand für „" + p.name + "“:", n);
            if (v !== null && v.trim() !== "" && !isNaN(v)) setStock(p.id, parseInt(v, 10));
          });
          frag.appendChild(row);
        });
      });

      const list = $("list");
      list.classList.remove("loading");
      list.innerHTML = "";
      list.appendChild(frag);

      $("statTotal").textContent = total;
      $("statLow").textContent = low;
      $("statOut").textContent = out;
    }

    // ---- Offline-Hinweis ----
    const note = $("offlineNote");
    addEventListener("online",  () => { note.style.display = "none"; });
    addEventListener("offline", () => { note.style.display = "block"; });
  </script>
</body>
</html>
