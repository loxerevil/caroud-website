<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – Caroud</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <style>
    @font-face {
      font-family: "Playfair Display";
      font-style: normal; font-weight: 400 500; font-display: swap;
      src: url("/fonts/playfair-400.woff2") format("woff2");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #1c1b19;
      color: #f2efe9;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 480px; }
    .logo { height: 24px; width: auto; margin: 0 auto 2.4rem; opacity: 0.9; }
    .code {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(3.4rem, 12vw, 5.5rem);
      line-height: 1;
      color: #b9a06a;
      margin-bottom: 0.9rem;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.4rem, 4.5vw, 1.9rem);
      margin-bottom: 0.9rem;
    }
    p { color: rgba(255, 255, 255, 0.7); line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #b9a06a; color: #111;
      padding: 0.85rem 2rem;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      text-decoration: none;
    }
    .btn:hover { background: #a08a55; }
    .sub { margin-top: 1.4rem; font-size: 0.8rem; }
    .sub a { color: #b9a06a; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/img/logo-text-transparent.png" alt="Caroud">
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Der Link ist vielleicht alt oder vertippt. Die Düfte sind aber da, wo sie hingehören.</p>
    <a class="btn" href="/">Zurück zum Shop</a>
    <p class="sub">Oder direkt zu den <a href="/#duefte">sieben Düften</a>.</p>
  </div>
</body>
</html>
